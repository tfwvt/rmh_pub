<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Robert M. Herzog</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses from the old thezog.com site, mapped to their new home.
    // Generated by build.js from the `legacy` lists in content/writing/*.md.
    // This only takes effect when the site is served from the domain root.
    (function () {
      var redirects = {{redirects}};
      var path = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, "") || "/";
      var target = redirects[path];
      if (target) location.replace(/^https?:/.test(target) ? target : "/" + target);
    })();
  </script>
  <!-- This page can be served at any address, so its links start from the site root (/). -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    /* The site's own copies of Fraunces and Inter (see the top of styles.css). */
    @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 300 700; font-display: swap; src: url("/assets/fonts/fraunces-latin.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap; src: url("/assets/fonts/inter-latin.woff2") format("woff2"); }
    :root { --paper: #f5f1e8; --ink: #1a1714; --muted: #6c645a; --accent: #9c521d; }
    @media (prefers-color-scheme: dark) { :root { --paper: #121110; --ink: #f1ece3; --muted: #8e8579; --accent: #e09a5c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 17px/1.6 Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font: 400 clamp(36px, 7vw, 56px)/1.1 Fraunces, Georgia, serif; margin: 0 0 16px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
  {{analytics}}
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>There’s nothing at this address. If you followed a link to Robert’s old site, everything from it is still here: <a href="/">start from the home page</a> or browse <a href="/#writing">all writing</a>.</p>
  </main>
</body>
</html>
