<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Robert M. Herzog</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses from the old thezog.com site, mapped to their new home.
    // Generated by build.js from the `legacy` lists in content/writing/*.md.
    // This only takes effect when the site is served from the domain root.
    (function () {
      var redirects = {{redirects}};
      var path = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, "") || "/";
      var target = redirects[path];
      if (target) location.replace(/^https?:/.test(target) ? target : "/" + target);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · theme: Specimen · redesign: restyle · the not-found page, its tokens inline because it may be served from any path */
    :root { color-scheme: light dark; --color-paper: oklch(96.5% 0.016 82); --color-ink: oklch(17% 0.012 60); --color-muted: oklch(49% 0.014 65); --color-accent: oklch(45% 0.18 262); --color-focus: oklch(50% 0.18 262);
      --font-display: "Bodoni Moda", ui-serif, Georgia, serif; --font-body: "Geist", ui-sans-serif, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --color-paper: oklch(15% 0.012 82); --color-ink: oklch(94% 0.012 82); --color-muted: oklch(70% 0.014 70); --color-accent: oklch(72% 0.13 262); --color-focus: oklch(74% 0.14 262); } }
    html, body { overflow-x: clip; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--color-paper); color: var(--color-ink); font: 400 17px/1.6 var(--font-body); padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font: 400 clamp(36px, 7vw, 56px)/1.05 var(--font-display); font-variation-settings: "opsz" 96; letter-spacing: -0.02em; margin: 0 0 16px; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
    p { color: var(--color-muted); }
    a { color: var(--color-ink); text-decoration-color: var(--color-accent); text-underline-offset: 0.18em; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Robert’s site has a new home. Everything is still here: <a href="/">start from the home page</a> or browse <a href="/#writing">all writing</a>.</p>
  </main>
</body>
</html>
