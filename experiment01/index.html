<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>experiment01 – Bouncing Q*bert</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #10102a;
      color: #f0f0f0;
      font-family: "Courier New", monospace;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.1em;
    }
    svg {
      width: min(90vw, 400px);
      height: auto;
    }

    /* All three parts share one timeline so they stay in sync. */
    .qbert, .spring, .shadow {
      animation-duration: 1.2s;
      animation-iteration-count: infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .qbert  { animation-name: bounce; }
    .spring { animation-name: coil; }
    .shadow { animation-name: shadow; transform-origin: 50% 50%; }
    .spring path { vector-effect: non-scaling-stroke; }

    /* Spring rest height is 100px; Q*bert's y offset tracks its top. */
    @keyframes bounce {
      0%   { transform: translateY(50px) scale(1.15, 0.85); animation-timing-function: ease-out; }
      20%  { transform: translateY(-20px) scale(0.92, 1.1); animation-timing-function: ease-out; }
      50%  { transform: translateY(-180px) scale(1, 1);     animation-timing-function: ease-in; }
      80%  { transform: translateY(0) scale(0.95, 1.05);     animation-timing-function: ease-out; }
      100% { transform: translateY(50px) scale(1.15, 0.85); }
    }
    @keyframes coil {
      0%   { transform: scaleY(0.5);  animation-timing-function: ease-out; }
      20%  { transform: scaleY(1.2); }
      30%  { transform: scaleY(0.92); }
      40%  { transform: scaleY(1.05); }
      50%  { transform: scaleY(1); }
      80%  { transform: scaleY(1);    animation-timing-function: ease-out; }
      100% { transform: scaleY(0.5); }
    }
    @keyframes shadow {
      0%, 100% { transform: scale(1.1); opacity: 0.6; }
      50%      { transform: scale(0.6); opacity: 0.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      .qbert, .spring, .shadow { animation-play-state: paused; }
    }
  </style>
</head>
<body>
  <h1>@!#?@!</h1>

  <svg viewBox="0 0 400 500" role="img" aria-label="Q*bert bouncing on a spring">
    <!-- Ground -->
    <rect x="0" y="470" width="400" height="30" fill="#2e6fd8"/>
    <rect x="0" y="470" width="400" height="6" fill="#7fb2ff"/>
    <ellipse class="shadow" cx="200" cy="470" rx="60" ry="8" fill="#000"/>

    <!-- Spring: base plate fixed, coil scales from the bottom -->
    <rect x="160" y="460" width="80" height="10" rx="3" fill="#9aa0a8"/>
    <g class="spring">
      <path d="M200 460 L170 450 L230 440 L170 430 L230 420 L170 410 L230 400 L170 390 L230 380 L170 370 L200 360"
            fill="none" stroke="#d4d8de" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- Q*bert: feet rest at y=360, the top of the uncompressed spring -->
    <g class="qbert">
      <!-- legs -->
      <rect x="182" y="330" width="9" height="24" fill="#f47a1f"/>
      <rect x="209" y="330" width="9" height="24" fill="#f47a1f"/>
      <!-- feet -->
      <ellipse cx="180" cy="356" rx="14" ry="5" fill="#7a2e8c"/>
      <ellipse cx="207" cy="356" rx="14" ry="5" fill="#7a2e8c"/>
      <!-- body -->
      <circle cx="205" cy="290" r="48" fill="#f47a1f"/>
      <circle cx="190" cy="272" r="14" fill="#ffa04d" opacity="0.6"/>
      <!-- snout -->
      <path d="M182 296 L132 320 L142 340 L192 314 Z" fill="#e0661a"/>
      <ellipse cx="137" cy="330" rx="8" ry="12" transform="rotate(-25 137 330)" fill="#f47a1f"/>
      <ellipse cx="137" cy="330" rx="5" ry="8" transform="rotate(-25 137 330)" fill="#2a0d00"/>
      <!-- eyes -->
      <ellipse cx="190" cy="268" rx="11" ry="13" fill="#fff"/>
      <ellipse cx="216" cy="266" rx="11" ry="13" fill="#fff"/>
      <circle cx="185" cy="272" r="5" fill="#000"/>
      <circle cx="211" cy="270" r="5" fill="#000"/>
    </g>
  </svg>
</body>
</html>
