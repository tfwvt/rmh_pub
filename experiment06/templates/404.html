<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Robert M. Herzog</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses from the old thezog.com site, mapped to their new home.
    // Generated by build.js from the `legacy` lists in content/writing/*.md.
    // This only takes effect when the site is served from the domain root.
    (function () {
      var redirects = {{redirects}};
      var path = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, "") || "/";
      var target = redirects[path];
      if (target) location.replace(/^https?:/.test(target) ? target : "/" + target);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --carbon: #0c0b0a; --card: #141210; --silver: #ebe8e0; --silver-2: #c8c4b9; --frame: rgb(236 229 212 / 0.34); color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--carbon); color: var(--silver); font: 400 17px/1.6 Jost, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { position: relative; max-width: 34rem; padding: 48px 40px; text-align: center; background: var(--card); border: 1px solid var(--frame); }
    main::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--frame); pointer-events: none; }
    h1 { font: 400 clamp(36px, 7vw, 56px)/1.1 "IM Fell English", Georgia, serif; margin: 0 0 16px; }
    p { position: relative; margin: 0; font: italic 400 20px/1.5 "IM Fell English", Georgia, serif; color: var(--silver-2); }
    a { color: var(--silver); text-underline-offset: 0.2em; }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Robert’s site has a new home. Everything is still here — <a href="/">start from the home page</a> or browse <a href="/#writing">all writing</a>.</p>
  </main>
</body>
</html>
