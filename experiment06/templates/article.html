<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Robert M. Herzog</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0c0b0a">
  <meta name="color-scheme" content="dark">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="author" content="Robert M. Herzog">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230c0b0a'/%3E%3Crect x='5' y='5' width='54' height='54' fill='none' stroke='%23ece5d4' stroke-width='2'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='32' text-anchor='middle' fill='%23ece5d4'%3EZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Jost:wght@400;500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{prefix}}styles.css">
</head>
<body class="article-page">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="{{prefix}}index.html">Robert M. Herzog</a>
      <nav class="site-nav site-nav-static" aria-label="Main">
        <a href="{{prefix}}index.html#film">Film</a>
        <a href="{{prefix}}index.html#books">Books</a>
        <a href="{{prefix}}index.html#writing">Writing</a>
        <a href="{{prefix}}index.html#about">About</a>
        <a href="{{prefix}}index.html#follow" class="nav-cta">Subscribe</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <article class="article">
      <header class="article-head wrap-narrow">
        <a class="back-link" href="{{prefix}}index.html#writing"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>All writing</a>
        <div class="title-card article-card grain">
          <h1 class="article-title">{{title}}</h1>
          <p class="article-meta">{{meta}}</p>
          {{dek}}
          <p class="article-byline">Robert M. Herzog</p>
          {{venue}}
        </div>
      </header>
      {{hero}}
      <div class="wrap-narrow">
        <div class="{{proseClass}}">
{{body}}
        </div>
        <footer class="article-foot">
          {{alsoOn}}
          <div class="article-subscribe title-card">
            <p>New essays and stories, straight to your inbox.</p>
            <a class="btn btn-primary" href="https://robertherzog.substack.com/subscribe" target="_blank" rel="noopener">Subscribe on Substack</a>
          </div>
        </footer>
      </div>
    </article>
    {{more}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© {{year}} Robert M. Herzog</p>
      <ul class="footer-links">{{social}}</ul>
    </div>
  </footer>
</body>
</html>
