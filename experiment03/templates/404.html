<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Robert M. Herzog</title>
  <meta name="robots" content="noindex">
  <script>
    // Addresses from the old thezog.com site, mapped to their new home.
    // Generated by build.js from the `legacy` lists in content/writing/*.md.
    // This only takes effect when the site is served from the domain root.
    (function () {
      var redirects = {{redirects}};
      var path = decodeURIComponent(location.pathname).toLowerCase().replace(/\/+$/, "") || "/";
      var target = redirects[path];
      if (target) location.replace(/^https?:/.test(target) ? target : "/" + target);
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #f5f1e8; --ink: #1a1714; --muted: #7a7166; --accent: #a4561f; }
    @media (prefers-color-scheme: dark) { :root { --paper: #121110; --ink: #f1ece3; --muted: #8e8579; --accent: #e09a5c; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 17px/1.6 Inter, system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 32rem; text-align: center; }
    h1 { font: 400 clamp(36px, 7vw, 56px)/1.1 Fraunces, Georgia, serif; margin: 0 0 16px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>This page has moved</h1>
    <p>Robert’s site has a new home. Everything is still here — <a href="/">start from the home page</a> or browse <a href="/#writing">all writing</a>.</p>
  </main>
</body>
</html>
