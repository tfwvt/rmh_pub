<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Robert M. Herzog</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="author" content="Robert M. Herzog">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1714'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23e09a5c'%3EZ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{prefix}}styles.css">
</head>
<body class="article-page">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="{{prefix}}index.html">Robert M. Herzog</a>
      <nav class="site-nav site-nav-static" aria-label="Main">
        <a href="{{prefix}}index.html#film">Film</a>
        <a href="{{prefix}}index.html#books">Books</a>
        <a href="{{prefix}}index.html#writing">Writing</a>
        <a href="{{prefix}}index.html#about">About</a>
        <a href="{{prefix}}index.html#follow" class="nav-cta">Subscribe</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <article class="article">
      <header class="article-head wrap-narrow">
        <a class="back-link" href="{{prefix}}index.html#writing">← All writing</a>
        <p class="eyebrow">{{meta}}</p>
        <h1 class="article-title">{{title}}</h1>
        {{dek}}
        <p class="article-byline">Robert M. Herzog</p>
        {{venue}}
      </header>
      {{hero}}
      <div class="wrap-narrow">
        <div class="{{proseClass}}">
{{body}}
        </div>
        <footer class="article-foot">
          {{alsoOn}}
          <div class="article-subscribe">
            <p>New essays and stories, straight to your inbox.</p>
            <a class="btn btn-primary" href="https://robertherzog.substack.com/subscribe" target="_blank" rel="noopener">Subscribe on Substack</a>
          </div>
        </footer>
      </div>
    </article>
    {{more}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>© {{year}} Robert M. Herzog</p>
      <ul class="footer-links">{{social}}</ul>
    </div>
  </footer>
</body>
</html>
